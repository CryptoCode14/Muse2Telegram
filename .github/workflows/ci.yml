name: Offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared requirements
        run: python -m pip install -r muse-runtime/requirements.txt
      - name: Compile all bridge modules and tests
        run: python -m compileall -q muse-runtime/bridge_core muse-runtime/tests
      - name: Run credential-free regression suite
        run: cd muse-runtime && python -m unittest discover -s tests -q
